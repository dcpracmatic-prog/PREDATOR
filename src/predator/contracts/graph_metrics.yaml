# COMMONWEAVE Zero / ZTGE — graph metrics contract (Python pure functions)
name: graph_metrics
version: "0.3.0"
language: python
library: clan_subnet_detector.graph.metrics
abi: pure_python
description: >
  Pure metric functions over the Graph ADT. Bound so the engine can treat
  Python and native layers under the same contract surface.

functions:
  - name: density
    description: Edge density of G (undirected: 2m / n(n-1))
    returns: {type: float64}
    parameters:
      - {name: g, type: Graph, direction: in}
    ensures:
      - {expr: "0.0 <= result <= 1.0"}

  - name: connected_components
    description: Connected components as lists of node ids
    returns: {type: list_of_lists}
    parameters:
      - {name: g, type: Graph, direction: in}

  - name: degree_sequence
    description: Degree of each node in 0..n-1 order
    returns: {type: list_int}
    parameters:
      - {name: g, type: Graph, direction: in}

  - name: is_independent
    description: True iff nodes form an independent set of g
    returns: {type: bool}
    parameters:
      - {name: g, type: Graph, direction: in}
      - {name: nodes, type: list_int, direction: in}

  - name: is_clique
    description: True iff nodes form a clique of g
    returns: {type: bool}
    parameters:
      - {name: g, type: Graph, direction: in}
      - {name: nodes, type: list_int, direction: in}
