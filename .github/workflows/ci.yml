name: PREDATOR CI

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Set up C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[yaml,dev,crypto,mcp]"
      - name: Build MORPH
        run: make build-morph
      - name: Run tests
        env:
          MORPH_DUMP_BIN: ${{ github.workspace }}/vendor/morph_src/dump_morph
        run: python -m pytest tests -q
      - name: Check installed CLI entry points
        env:
          MORPH_DUMP_BIN: ${{ github.workspace }}/vendor/morph_src/dump_morph
        run: |
          predator-status
          ztge-status
          predator-detect --help
          predator-api --help
          ztge-api --help
      - name: Run deterministic planner performance smoke benchmark
        env:
          MORPH_DUMP_BIN: ${{ github.workspace }}/vendor/morph_src/dump_morph
        run: |
          python benchmarks/stress_validation.py --sizes 256,768,1600 --repeats 2 --budget-ms 50 --max-ms 10000 --output /tmp/ztge-performance.json
      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: ztge-performance-python-${{ matrix.python-version }}
          path: /tmp/ztge-performance.json
          if-no-files-found: error
      - name: Build wheel and verify clean installation
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/ztge-wheel
          python -m venv /tmp/ztge-clean-venv
          wheel="$(find /tmp/ztge-wheel -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          /tmp/ztge-clean-venv/bin/python -m pip install "${wheel}[yaml,crypto]"
          cd /tmp
          /tmp/ztge-clean-venv/bin/predator-status
          /tmp/ztge-clean-venv/bin/ztge-status
          /tmp/ztge-clean-venv/bin/predator-detect --help
          /tmp/ztge-clean-venv/bin/predator-api --help
          /tmp/ztge-clean-venv/bin/ztge-api --help
