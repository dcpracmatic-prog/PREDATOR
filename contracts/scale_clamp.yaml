# COMMONWEAVE Zero — scale_clamp contract
name: scale_clamp
version: "0.1.0"
language: c
library: libmatmul.so
abi: c99
description: >
  Scale a float64 buffer and clamp each element into [lo, hi].
  Requires hi >= lo. NaN inputs yield CW_ERR_DIM without writing out.

functions:
  - name: scale_clamp
    description: out[i] = clamp(in[i] * scale, lo, hi) for i in [0, length)
    returns:
      type: int
      meaning: error_code
      values:
        0: OK
        1: NULL_POINTER
        2: INVALID_DIMENSION
        3: OVERFLOW
        4: ALIGNMENT
        5: VALUE_OUT_OF_RANGE
    memory: {copy: none_required}
    requires:
      - {expr: "hi >= lo", code: 2}
      - {expr: "length >= 1", code: 2}
    parameters:
      - {name: in_buf,  type: pointer, element: float64, direction: in,  shape: [length]}
      - {name: out_buf, type: pointer, element: float64, direction: out, shape: [length]}
      - {name: length,  type: size_t, constraints: [1, 10000000], violation_codes: {below: 2, above: 3}}
      - {name: scale,   type: float64}
      - {name: lo,      type: float64}
      - {name: hi,      type: float64}
